<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-5xl mx-auto p-6">

        <h1 class="text-4xl font-black mb-6">🛒 السلة</h1>

        <!-- ITEMS -->
        <div id="cartItems" class="space-y-4"></div>

        <!-- EMPTY -->
        <div id="empty" class="hidden text-center text-gray-500 mt-10">
            السلة فاضية
        </div>

        <!-- SUMMARY -->
        <div class="mt-10 bg-white p-6 rounded-2xl shadow">

            <div class="flex justify-between mb-3">
                <span>المجموع</span>
                <span id="subtotal">0</span>
            </div>

            <div class="flex justify-between mb-3">
                <span>الشحن</span>
                <span id="shipping">0</span>
            </div>

            <hr class="my-3">

            <div class="flex justify-between text-xl font-bold">
                <span>الإجمالي</span>
                <span id="total">0</span>
            </div>

        </div>

    </div>

    <script>
        // 🟢 بيانات تجريبية
        let cart = [
            { name: "iPhone 15", price: 30000, qty: 1 },
            { name: "Samsung S24", price: 25000, qty: 2 }
        ];

        function renderCart() {
            let container = document.getElementById("cartItems");
            let empty = document.getElementById("empty");

            container.innerHTML = "";

            if (cart.length === 0) {
                empty.classList.remove("hidden");
                updateSummary();
                return;
            }

            empty.classList.add("hidden");

            cart.forEach((item, i) => {

                container.innerHTML += `
        <div class="bg-white p-4 rounded-2xl shadow flex justify-between items-center">

            <div>
                <h3 class="font-bold text-lg">${item.name}</h3>
                <p class="text-purple-600 font-bold">${item.price * item.qty} ج.م</p>
            </div>

            <div class="flex items-center gap-3">

                <button onclick="changeQty(${i}, -1)"
                class="px-3 py-1 bg-red-500 text-white rounded">-</button>

                <span>${item.qty}</span>

                <button onclick="changeQty(${i}, 1)"
                class="px-3 py-1 bg-green-500 text-white rounded">+</button>

                <button onclick="removeItem(${i})"
                class="text-red-500 font-bold ml-3">حذف</button>

            </div>

        </div>
        `;
            });

            updateSummary();
        }

        function changeQty(i, val) {
            cart[i].qty += val;

            if (cart[i].qty <= 0) {
                cart.splice(i, 1);
            }

            renderCart();
        }

        function removeItem(i) {
            cart.splice(i, 1);
            renderCart();
        }

        // 🔥 الحسابات
        function updateSummary() {
            let subtotal = 0;

            cart.forEach(item => {
                subtotal += item.price * item.qty;
            });

            let shipping = subtotal > 0 ? 50 : 0;
            let total = subtotal + shipping;

            document.getElementById("subtotal").innerText = subtotal + " ج.م";
            document.getElementById("shipping").innerText = shipping + " ج.م";
            document.getElementById("total").innerText = total + " ج.م";
        }

        renderCart();
    </script>

</body>

</html>
